name: Build Installer
on: push
jobs:
    build-linux:
        name: Build for Linux
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup .NET SDK
              uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: 10.0.x

            - name: Cache NuGet packages
              uses: actions/cache@v6
              with:
                  path: ~/.nuget/packages
                  key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-nuget-

            - name: Restore dependencies
              run: dotnet restore --locked-mode

            - name: Build
              run: dotnet build --no-restore
    
    build-macos:
        name: Build for MacOs
        runs-on: macos-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup .NET SDK
              uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: 10.0.x

            - name: Cache NuGet packages
              uses: actions/cache@v6
              with:
                  path: ~/.nuget/packages
                  key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-nuget-

            - name: Restore dependencies
              run: dotnet restore --locked-mode

            - name: Build
              run: dotnet build --no-restore

    
    build-windows:
        name: Build for windows with the Inno Setup Installer
        runs-on: windows-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup .NET SDK
              uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: 10.0.x

            - name: Cache NuGet packages
              uses: actions/cache@v6
              with:
                  path: ~/.nuget/packages
                  key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-nuget-

            - name: Restore dependencies
              run: dotnet restore --locked-mode

            - name: Restore dependencies for win-x64 publish
              run: dotnet restore --locked-mode -r win-x64 -p:PublishReadyToRun=true ImgTagFanOut/ImgTagFanOut.csproj

            - name: Build
              run: dotnet build --no-restore

            - name: Publish
              run: dotnet publish -c Release --no-restore -p:PublishProfile=FolderProfile.pubxml ImgTagFanOut/ImgTagFanOut.csproj

            - name: Compile .ISS to .EXE Installer
              uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
              with:
                  path: setupScript.iss
                  options: /O+

            - uses: actions/upload-artifact@v7
              with:
                  path: InstallerOutput/ImgTagFanOut-installer.exe